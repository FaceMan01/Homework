<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Мой список дел</h1>

    <form id="add-todo-form">
        <h2>Добавить новую задачу</h2>
        <div class="form-group">
            <label for="title">Название:</label>
            <input type="text" id="title" name="title" required maxlength="100">
        </div>
        <div class="form-group">
            <label for="description">Описание:</label>
            <textarea id="description" name="description" maxlength="500"></textarea>
        </div>
        <button type="submit">Добавить</button>
    </form>

    <h2>Задачи</h2>
    <div class="filters">
        <button id="filter-all">Все</button>
        <button id="filter-active">Активные</button>
        <button id="filter-done">Выполненные</button>
    </div>
    <ul id="todo-list">
        <!-- Задачи будут загружены сюда с помощью JavaScript -->
        <li class="loading">Загрузка...</li>
    </ul>

    <script src="script.js"></script>
</body>
</html>
